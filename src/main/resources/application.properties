spring.application.name=sb-ecom
spring.ecom.app.jwtCookieName=springBootEcom
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
project.image=images/
server.port=8081
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc\:mysql\://localhost\:3306/ecommerce
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.base-url=https://openrouter.ai/api
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=nvidia/nemotron-3-ultra-550b-a55b:free